name = "gripnrip-rooms"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are available on the Workers Free plan. We never write to storage:
# rooms live only in memory and vanish when the last rider leaves.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
